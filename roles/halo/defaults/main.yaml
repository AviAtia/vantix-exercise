---
# Product line deployed by this role: lane | ct
halo_product: lane

# Kit installed on the host. Normally resolved from the kit by the Jenkins job.
halo_kit_version: "4.9"

# Image tag of the inference container, resolved from the kit.
halo_inference_image_version: "4.9.0"

# Where config files are fetched from. The offline flow repoints this to the USB stick.
halo_config_src: "https://raw.git.vantix.example/platform/config/{{ halo_kit_version }}"

halo_registry: registry.vantix.example
halo_registry_token: "{{ vault_halo_registry_token }}"
halo_site_key: "{{ vault_halo_site_key }}"

halo_base_dir: /opt/halo

# Inference container name differs per product.
halo_inference_service: "{{ 'lane-inference' if halo_product == 'lane' else 'ct-detector' }}"

# Detector pack to install on stations, e.g. dp-2.3. Chosen per site in SiteDesk.
# Empty: leave the station's current pack untouched.
halo_pack_version: ""

# Where detector packs and their checksum manifest are fetched from. Expects
# <src>/<halo_pack_version>.tgz and <src>/manifest.sha256.
# The offline flow repoints this to the USB stick (file:///media/usb/packs).
halo_pack_src: "https://{{ halo_registry }}/packs"

halo_timezone: UTC
# CT only: let the station follow the scanner's timezone (requires kit 4.5+).
halo_timezone_auto: false
